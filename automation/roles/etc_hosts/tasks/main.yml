---
# <mmkolpakov_changes>
- name: Add static entries into /etc/hosts file
  # </mmkolpakov_changes>
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ item }}"
    line: "{{ item }}"
    unsafe_writes: true # to prevent failures in CI
  loop: "{{ etc_hosts }}"
  when:
    - etc_hosts is defined
    - etc_hosts | length > 0
  tags: etc_hosts

# <mmkolpakov_changes>
- name: Add auto-generated entries for all cluster nodes into /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ".*{{ hostvars[item].inventory_hostname }}$"
    # <mmkolpakov_changes_dz_2>
    line: "{{ hostvars[item]['bind_address'] | default('SKIP') }} {{ hostvars[item].inventory_hostname }}"
    unsafe_writes: true
  loop: "{{ groups['all'] }}"
  when: hostvars[item].bind_address is defined
  # </mmkolpakov_changes_dz_2>
  tags: etc_hosts
# </mmkolpakov_changes>
