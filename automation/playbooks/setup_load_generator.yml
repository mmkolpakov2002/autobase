---
- name: Setup Load Generator (k6)
  hosts: monitoring_server
  become: true
  gather_facts: false

  roles:
    - role: k6

  tasks:
    - name: Copy load test script to server
      ansible.builtin.copy:
        src: ../files/stress_test.js
        dest: /etc/load_tests/stress_test.js
        mode: '0644'

    - name: Copy advanced load test script
      ansible.builtin.copy:
        src: ../files/stress_test_universal.js
        dest: /etc/load_tests/stress_test_universal.js
        mode: '0644'
